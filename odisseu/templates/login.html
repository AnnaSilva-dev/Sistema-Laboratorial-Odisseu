{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'odisseu/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'odisseu/css/style.css' %}">
</head>
<body>
    <section class="container login d-flex justify-content-center align-items-center ">
        <nav>
            <form method="post">
                {% csrf_token %}
                <section class="base-login">
                    <h4 class="text">
                        Bem-vindo(a)!
                    </h4>
                    <div class="borda"></div>
                    <p class="text-secondary-emphasis text">Faça o login para acessar o sistema</p>

                    <div class="login-form">
                        <label>Usuário</label>
                        <input class="edit-forms" type="text" name="username" placeholder="Username">
                        <i class="bi bi-person"></i>
                    </div>
                    <div class="login-form">
                        <label>Senha</label>
                        <input class="edit-forms" type="password" name="password" placeholder="Password">
                        <i class="bi bi-lock"></i>
                    </div>
                    <div class="ms my-5">
                        <button class="confirmar border-0 px-5 mt-3" type="submit"><span class="bi bi-door-open-fill"></span> Entrar</button>
                    </div> 
                </section>
            </form>
           
        </nav>
    </section>
</body>
</html>
